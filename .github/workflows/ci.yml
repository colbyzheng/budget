name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgres://u:p@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-only-placeholder-secret-0000000
          GOOGLE_CLIENT_ID: ci
          GOOGLE_CLIENT_SECRET: ci
